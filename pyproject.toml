[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supervisor"
version = "0.1.0"
description = "SCPS algorithm implemented as a supervisor module for the HighwayEnv driving environment."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "gymnasium>=1.0.0",
  # highway-env and stable-baselines3 are vendored in-repo (custom env registrations / DQN_ME).
  # Do not install the PyPI packages or they will shadow the local forks.
  "numpy>=2.2.4",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "torch>=2.7.1",
  "matplotlib>=3.10.1", # For analysis
  "tensorboard>=2.14.0" # For training logs
]
